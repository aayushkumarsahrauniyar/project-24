<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humble DZ • Login</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ---------- CSS Variables (theming) ---------- */
        :root {
            --color-emerald: #00E676;
            --color-cyan: #00D9FF;
            --color-emerald-glow: rgba(0, 230, 118, 0.25);
            --color-cyan-glow: rgba(0, 217, 255, 0.20);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.70);
            --text-muted: rgba(255, 255, 255, 0.40);
            --radius-card: 20px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Poppins', sans-serif;
            --max-width-card: 440px;
            --spacing-sm: 6px;
            --spacing-md: 16px;
            --spacing-lg: 28px;
            --spacing-xl: 40px;
        }

        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: #0a0a0a;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- Animated Background ---------- */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #0a0a0a;
            overflow: hidden;
        }

        /* Gradient blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            will-change: transform, opacity;
            animation: blobFloat 18s ease-in-out infinite alternate;
        }
        .blob--1 {
            width: 520px;
            height: 520px;
            top: -10%;
            left: -8%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.35), transparent 70%);
            animation-duration: 22s;
            animation-delay: -2s;
        }
        .blob--2 {
            width: 460px;
            height: 460px;
            bottom: -12%;
            right: -6%;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.30), transparent 70%);
            animation-duration: 26s;
            animation-delay: -6s;
        }
        .blob--3 {
            width: 340px;
            height: 340px;
            top: 40%;
            left: 55%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.18), transparent 70%);
            animation-duration: 20s;
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -50px) scale(1.05);
            }
            66% {
                transform: translate(-30px, 40px) scale(0.95);
            }
            100% {
                transform: translate(20px, -20px) scale(1.02);
            }
        }

        /* ---------- Particle Canvas ---------- */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ---------- Main Card Container ---------- */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: var(--max-width-card);
            margin: 0 auto;
        }

        /* Glassmorphism Card */
        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            box-shadow: var(--glass-shadow), 0 0 80px rgba(0, 230, 118, 0.04);
            padding: var(--spacing-xl) var(--spacing-lg);
            transition: box-shadow var(--transition-smooth), border-color var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        /* Subtle glow ring on hover */
        .auth-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-card);
            padding: 1px;
            background: conic-gradient(from 0deg at 50% 50%,
                    transparent,
                    var(--color-emerald-glow),
                    transparent 40%,
                    var(--color-cyan-glow),
                    transparent 80%,
                    transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
        }
        .auth-card:hover::before {
            opacity: 0.6;
        }

        /* Inner glow border (soft) */
        .auth-card::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: calc(var(--radius-card) - 1px);
            background: transparent;
            box-shadow: inset 0 0 60px rgba(0, 230, 118, 0.03);
            pointer-events: none;
        }

        /* ---------- Brand / Logo ---------- */
        .brand {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 217, 255, 0.10));
            border: 1px solid rgba(0, 230, 118, 0.20);
            font-size: 30px;
            color: var(--color-emerald);
            margin-bottom: var(--spacing-sm);
            transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
        }
        .brand-icon:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.15);
        }
        .brand-name {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--color-emerald), var(--color-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .brand-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* ---------- Toggle Tabs ---------- */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 4px;
            margin-bottom: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .auth-tabs .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            position: relative;
            z-index: 2;
            letter-spacing: 0.3px;
        }
        .auth-tabs .tab-btn:hover {
            color: #fff;
        }
        .auth-tabs .tab-btn:focus-visible {
            outline: 2px solid var(--color-cyan);
            outline-offset: 2px;
        }
        .auth-tabs .tab-btn.active {
            color: #fff;
            background: rgba(0, 230, 118, 0.12);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.05);
        }
        .auth-tabs .tab-btn.active::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, var(--color-emerald), var(--color-cyan));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ---------- Forms ---------- */
        .auth-form {
            display: none;
            flex-direction: column;
            gap: var(--spacing-md);
            animation: fadeSlide 0.4s ease;
        }
        .auth-form.active {
            display: flex;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group label i {
            color: var(--color-emerald);
            font-size: 0.85rem;
            width: 18px;
            text-align: center;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
            overflow: hidden;
        }
        .input-wrap:focus-within {
            border-color: var(--color-emerald);
            box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.10), 0 0 30px rgba(0, 230, 118, 0.02);
        }
        .input-wrap .input-icon {
            padding: 0 0 0 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color var(--transition-smooth);
            pointer-events: none;
        }
        .input-wrap:focus-within .input-icon {
            color: var(--color-emerald);
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 10px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: var(--font-family);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.2px;
        }
        .input-wrap input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 0.85rem;
        }
        .input-wrap input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(20, 20, 20, 0.9) inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        /* Password toggle */
        .toggle-pass {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            font-size: 0.9rem;
            transition: color var(--transition-smooth);
            border-radius: 8px;
        }
        .toggle-pass:hover {
            color: var(--text-secondary);
        }
        .toggle-pass:focus-visible {
            outline: 2px solid var(--color-cyan);
            outline-offset: 2px;
        }

        /* ---------- Submit Button ---------- */
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: var(--spacing-sm);
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--color-emerald), #00c96b);
            color: #0a0a0a;
            font-family: var(--font-family);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 230, 118, 0.25);
        }
        .btn-submit:active:not(:disabled) {
            transform: translateY(0px) scale(0.98);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-submit:focus-visible {
            outline: 3px solid var(--color-cyan);
            outline-offset: 3px;
        }
        .btn-submit .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(10, 10, 10, 0.15);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-submit.loading .spinner {
            display: block;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }
        .btn-submit.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Form Footer ---------- */
        .form-footer {
            text-align: center;
            margin-top: var(--spacing-sm);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .form-footer a {
            color: var(--color-cyan);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-smooth);
            border-bottom: 1px solid transparent;
        }
        .form-footer a:hover {
            color: var(--color-emerald);
            border-bottom-color: var(--color-emerald);
        }
        .form-footer a:focus-visible {
            outline: 2px solid var(--color-cyan);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ---------- Toast Notifications ---------- */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            color: #fff;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            margin-top: 1px;
        }
        .toast--success .toast-icon {
            background: rgba(0, 230, 118, 0.15);
            color: var(--color-emerald);
        }
        .toast--error .toast-icon {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }
        .toast--info .toast-icon {
            background: rgba(0, 217, 255, 0.15);
            color: var(--color-cyan);
        }
        .toast-body {
            flex: 1;
        }
        .toast-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .toast-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        .toast-close {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color var(--transition-smooth);
            border-radius: 6px;
            margin-top: -2px;
        }
        .toast-close:hover {
            color: #fff;
        }
        .toast-close:focus-visible {
            outline: 2px solid var(--color-cyan);
            outline-offset: 2px;
        }

        /* ---------- Skeleton Loader (demo) ---------- */
        .skeleton-demo {
            display: none;
        }

        /* ---------- Accessibility: focus-visible ---------- */
        :focus-visible {
            outline: 2px solid var(--color-cyan);
            outline-offset: 2px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 520px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 40px;
            }
            .auth-card {
                padding: var(--spacing-lg) var(--spacing-md);
            }
            .brand-name {
                font-size: 1.4rem;
            }
            .brand-icon {
                width: 54px;
                height: 54px;
                font-size: 24px;
            }
            .auth-tabs .tab-btn {
                font-size: 0.8rem;
                padding: 8px 0;
            }
            .input-wrap input {
                padding: 12px 14px 12px 8px;
                font-size: 0.9rem;
            }
            .btn-submit {
                padding: 12px;
                font-size: 0.9rem;
            }
            .toast-container {
                bottom: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
            }
            .toast {
                padding: 14px 16px;
                font-size: 0.85rem;
            }
            .blob--1 {
                width: 300px;
                height: 300px;
                top: -15%;
                left: -20%;
            }
            .blob--2 {
                width: 260px;
                height: 260px;
                bottom: -15%;
                right: -20%;
            }
            .blob--3 {
                width: 200px;
                height: 200px;
                top: 50%;
                left: 40%;
            }
        }

        @media (max-width: 380px) {
            .auth-card {
                padding: var(--spacing-md);
            }
            .brand-name {
                font-size: 1.2rem;
            }
            .auth-tabs .tab-btn {
                font-size: 0.7rem;
                padding: 6px 0;
            }
        }

        /* ---------- High-DPI / Retina ---------- */
        @media (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {
            .auth-card {
                backdrop-filter: blur(32px) saturate(1.6);
                -webkit-backdrop-filter: blur(32px) saturate(1.6);
            }
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .blob {
                animation: none !important;
            }
            .auth-form {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- BACKGROUND: Animated Blobs + Particle Canvas -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="blob blob--1"></div>
        <div class="blob blob--2"></div>
        <div class="blob blob--3"></div>
    </div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <!-- MAIN CARD -->
    <main class="auth-wrapper" role="main" aria-label="Authentication">

        <div class="auth-card" role="region" aria-label="Login or register card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <i class="fas fa-cube"></i>
                </div>
                <h1 class="brand-name">Humble DZ</h1>
                <p class="brand-sub">secure · minimal · modern</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
                <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="form-login" id="tab-login" tabindex="0">
                    <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Login
                </button>
                <button class="tab-btn" role="tab" aria-selected="false" aria-controls="form-register" id="tab-register" tabindex="-1">
                    <i class="fas fa-user-plus" aria-hidden="true"></i> Register
                </button>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="form-login" class="auth-form active" role="tabpanel" aria-labelledby="tab-login" novalidate autocomplete="on">
                <div class="form-group">
                    <label for="login-email"><i class="fas fa-envelope" aria-hidden="true"></i> Email</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password"><i class="fas fa-lock" aria-hidden="true"></i> Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><i class="fas fa-lock"></i></span>
                        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
                        <button type="button" class="toggle-pass" aria-label="Toggle password visibility" tabindex="0">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="login-btn">
                    <span class="btn-icon" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
                    <span class="btn-text">Sign In</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
                <div class="form-footer">
                    Don't have an account? <a href="#" id="switch-to-register" role="button">Register</a>
                </div>
            </form>

            <!-- ===== REGISTER FORM with CONFIRM PASSWORD ===== -->
            <form id="form-register" class="auth-form" role="tabpanel" aria-labelledby="tab-register" novalidate autocomplete="on">
                <div class="form-group">
                    <label for="reg-name"><i class="fas fa-user" aria-hidden="true"></i> Full Name</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><i class="fas fa-user"></i></span>
                        <input type="text" id="reg-name" placeholder="Alex Rivera" required autocomplete="name" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-email"><i class="fas fa-envelope" aria-hidden="true"></i> Email</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password"><i class="fas fa-lock" aria-hidden="true"></i> Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><i class="fas fa-lock"></i></span>
                        <input type="password" id="reg-password" placeholder="Min 6 characters" required autocomplete="new-password" minlength="6" />
                        <button type="button" class="toggle-pass" aria-label="Toggle password visibility" tabindex="0">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <!-- New Confirm Password field -->
                <div class="form-group">
                    <label for="reg-confirm-password"><i class="fas fa-check-circle" aria-hidden="true"></i> Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><i class="fas fa-check-circle"></i></span>
                        <input type="password" id="reg-confirm-password" placeholder="Re-enter password" required autocomplete="new-password" minlength="6" />
                        <button type="button" class="toggle-pass" aria-label="Toggle password visibility" tabindex="0">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="register-btn">
                    <span class="btn-icon" aria-hidden="true"><i class="fas fa-user-plus"></i></span>
                    <span class="btn-text">Create Account</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
                <div class="form-footer">
                    Already have an account? <a href="#" id="switch-to-login" role="button">Login</a>
                </div>
            </form>

        </div>
    </main>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- FIREBASE SDK (modular compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <script>
        // ================================================================
        //  1.  FIREBASE CONFIGURATION
        //  — Replace with your own Firebase project config.
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB3GIu78tATEum3SUUwShhuYGr-IcJF3Eo",
            authDomain: "firstproject-44.firebaseapp.com",
            projectId: "firstproject-44",
            storageBucket: "firstproject-44.firebasestorage.app",
            messagingSenderId: "324220801352",
            appId: "1:324220801352:web:8d9ffb5dcbf119cccf637d",
            measurementId: "G-9Q8G67HLNW"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ================================================================
        //  2.  DOM REFERENCES
        // ================================================================
        const loginForm = document.getElementById('form-login');
        const registerForm = document.getElementById('form-register');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const regName = document.getElementById('reg-name');
        const regEmail = document.getElementById('reg-email');
        const regPassword = document.getElementById('reg-password');
        const regConfirmPassword = document.getElementById('reg-confirm-password');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const switchToRegister = document.getElementById('switch-to-register');
        const switchToLogin = document.getElementById('switch-to-login');
        const toastContainer = document.getElementById('toastContainer');

        // All password toggle buttons
        const togglePassBtns = document.querySelectorAll('.toggle-pass');

        // ================================================================
        //  3.  TOAST SYSTEM
        // ================================================================
        function showToast(message, type = 'info', title = '') {
            const iconMap = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            const titleMap = {
                success: 'Success',
                error: 'Error',
                info: 'Notice'
            };

            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;
            toast.setAttribute('role', 'alert');

            toast.innerHTML = `
                <div class="toast-icon" aria-hidden="true">
                    <i class="fas ${iconMap[type] || iconMap.info}"></i>
                </div>
                <div class="toast-body">
                    <div class="toast-title">${title || titleMap[type] || 'Info'}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" aria-label="Dismiss notification">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            `;

            toastContainer.appendChild(toast);

            // Trigger show
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            // Auto-dismiss after 4.5s
            let timeout = setTimeout(() => {
                dismissToast(toast);
            }, 4500);

            // Close button
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                clearTimeout(timeout);
                dismissToast(toast);
            });

            // Keyboard: Escape to dismiss
            toast.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    clearTimeout(timeout);
                    dismissToast(toast);
                }
            });

            // Pause auto-dismiss on hover
            toast.addEventListener('mouseenter', () => clearTimeout(timeout));
            toast.addEventListener('mouseleave', () => {
                timeout = setTimeout(() => dismissToast(toast), 3500);
            });

            return toast;
        }

        function dismissToast(toast) {
            toast.classList.remove('show');
            toast.addEventListener('transitionend', () => {
                if (toast.parentNode) toast.remove();
            }, { once: true });
            // fallback
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 500);
        }

        // ================================================================
        //  4.  AUTH FUNCTIONS
        // ================================================================

        // ---- Login ----
        async function handleLogin(e) {
            e.preventDefault();
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                showToast('Please fill in both email and password.', 'error');
                return;
            }

            setLoading(loginBtn, true);

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showToast(`Welcome back, ${email.split('@')[0]}!`, 'success', 'Signed In');
                // Redirect to index.html after a short delay (toast visible)
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (err) {
                const msg = getAuthErrorMessage(err.code);
                showToast(msg, 'error', 'Login Failed');
                setLoading(loginBtn, false);
            } finally {
                // In case of error, re-enable button; on success we redirect so it's fine
                if (loginBtn.classList.contains('loading')) {
                    setLoading(loginBtn, false);
                }
            }
        }

        // ---- Register ----
        async function handleRegister(e) {
            e.preventDefault();
            const name = regName.value.trim();
            const email = regEmail.value.trim();
            const password = regPassword.value.trim();
            const confirm = regConfirmPassword.value.trim();

            if (!name || !email || !password || !confirm) {
                showToast('Please fill in all fields.', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirm) {
                showToast('Passwords do not match. Please re-enter.', 'error');
                regConfirmPassword.value = '';
                regConfirmPassword.focus();
                return;
            }

            setLoading(registerBtn, true);

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({ displayName: name });
                showToast(`Welcome, ${name}! Your account has been created.`, 'success', 'Registered');
                registerForm.reset();
                // Optionally switch to login tab
                switchTab('login');
            } catch (err) {
                const msg = getAuthErrorMessage(err.code);
                showToast(msg, 'error', 'Registration Failed');
            } finally {
                setLoading(registerBtn, false);
            }
        }

        // ---- Auth state listener ----
        // If user is already logged in, redirect to index.html immediately.
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Redirect to dashboard
                window.location.href = 'index.html';
            }
        });

        // ---- Sign out (optional) ----
        window.signOut = async function() {
            try {
                await auth.signOut();
                showToast('You have been signed out.', 'info', 'Signed Out');
            } catch (err) {
                showToast('Error signing out.', 'error');
            }
        };

        // ---- Helper: get user-friendly error message ----
        function getAuthErrorMessage(code) {
            const map = {
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/email-already-in-use': 'This email is already registered.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/weak-password': 'Password should be at least 6 characters.',
                'auth/too-many-requests': 'Too many attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Check your connection.',
                'auth/internal-error': 'Something went wrong. Please try again.',
            };
            return map[code] || 'An unexpected error occurred. Please try again.';
        }

        // ---- Helper: set loading state ----
        function setLoading(btn, isLoading) {
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ================================================================
        //  5.  TAB SWITCHING
        // ================================================================
        function switchTab(tab) {
            const isLogin = tab === 'login';

            tabLogin.classList.toggle('active', isLogin);
            tabLogin.setAttribute('aria-selected', isLogin);
            tabLogin.tabIndex = isLogin ? 0 : -1;

            tabRegister.classList.toggle('active', !isLogin);
            tabRegister.setAttribute('aria-selected', !isLogin);
            tabRegister.tabIndex = !isLogin ? 0 : -1;

            loginForm.classList.toggle('active', isLogin);
            registerForm.classList.toggle('active', !isLogin);

            if (isLogin) {
                loginEmail.focus();
            } else {
                regName.focus();
            }
        }

        // ---- Tab click handlers ----
        tabLogin.addEventListener('click', () => switchTab('login'));
        tabRegister.addEventListener('click', () => switchTab('register'));

        // ---- Keyboard arrow keys for tabs ----
        const tabs = [tabLogin, tabRegister];
        tabs.forEach((tab, idx) => {
            tab.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    const next = tabs[(idx + 1) % tabs.length];
                    next.click();
                    next.focus();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = tabs[(idx - 1 + tabs.length) % tabs.length];
                    prev.click();
                    prev.focus();
                }
            });
        });

        // ---- Switch links ----
        switchToRegister.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab('register');
        });
        switchToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab('login');
        });

        // ================================================================
        //  6.  PASSWORD TOGGLE (all inputs)
        // ================================================================
        togglePassBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = btn.closest('.input-wrap').querySelector('input');
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                btn.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
                btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });

            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
        });

        // ================================================================
        //  7.  FORM SUBMISSIONS
        // ================================================================
        loginForm.addEventListener('submit', handleLogin);
        registerForm.addEventListener('submit', handleRegister);

        // ================================================================
        //  8.  PARTICLE SYSTEM (floating background)
        // ================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleCount = 70;
        let animFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() - 0.5) * 0.35;
                this.opacity = Math.random() * 0.5 + 0.15;
                const hue = Math.random() > 0.5 ? 145 : 190;
                this.color = `hsla(${hue}, 80%, 60%, ${this.opacity})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                if (this.size > 1.5) {
                    ctx.shadowColor = 'rgba(0,230,118,0.05)';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        function initParticles() {
            particles = [];
            const area = canvas.width * canvas.height;
            const target = Math.min(120, Math.max(40, Math.floor(area / 15000)));
            particleCount = target;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p) => {
                p.update();
                p.draw();
            });
            animFrameId = requestAnimationFrame(animateParticles);
        }

        // ---- Start particles ----
        resizeCanvas();
        initParticles();
        animateParticles();

        // ---- Stop on page hide (performance) ----
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (animFrameId) cancelAnimationFrame(animFrameId);
            } else {
                animateParticles();
            }
        });

        // ================================================================
        //  9.  KEYBOARD SHORTCUTS (global)
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) {
                e.preventDefault();
                switchTab('login');
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) {
                e.preventDefault();
                switchTab('register');
            }
        });

        // ================================================================
        //  10. INITIAL FOCUS & WELCOME
        // ================================================================
        window.addEventListener('load', () => {
            if (loginForm.classList.contains('active')) {
                loginEmail.focus();
            } else {
                regName.focus();
            }
            setTimeout(() => {
                showToast('Welcome to Humble DZ. Secure & modern.', 'info', 'Welcome');
            }, 800);
        });

        // ================================================================
        //  11. DEMO: Skeleton loader (accessible via console)
        // ================================================================
        window.demoSkeleton = function() {
            showToast('Skeleton loaders are ready for your data views.', 'info', 'Skeleton Demo');
        };

        console.log('🚀 Humble DZ · UI ready');
        console.log('💡 Try: signOut() to sign out, demoSkeleton() for skeleton demo');
        console.log('⌨️  Ctrl+Shift+L → Login  |  Ctrl+Shift+R → Register');
    </script>

</body>
