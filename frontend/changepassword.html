<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humble DZ · Change Password</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
           CSS VARIABLES — Premium Dark Theme
           ============================================================ */
        :root {
            --color-emerald: #00E676;
            --color-cyan: #00D9FF;
            --color-emerald-dim: rgba(0, 230, 118, 0.12);
            --color-cyan-dim: rgba(0, 217, 255, 0.10);
            --color-emerald-glow: rgba(0, 230, 118, 0.20);
            --color-cyan-glow: rgba(0, 217, 255, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --text-muted: rgba(255, 255, 255, 0.38);
            --radius-card: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Inter', 'Poppins', sans-serif;
            --header-height: 68px;
            --bottom-nav-height: 64px;
            --danger: #ff5252;
            --warning: #ffab40;
            --info: #40c4ff;
        }

        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background: #080808;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0, 230, 118, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 217, 255, 0.02) 0%, transparent 50%);
            padding: 20px;
        }

        /* ---------- Animated Background ---------- */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #080808;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            will-change: transform, opacity;
            animation: blobFloat 24s ease-in-out infinite alternate;
        }
        .blob--1 {
            width: 600px;
            height: 600px;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.25), transparent 70%);
            animation-duration: 28s;
        }
        .blob--2 {
            width: 500px;
            height: 500px;
            bottom: -10%;
            right: -5%;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.20), transparent 70%);
            animation-duration: 30s;
            animation-delay: -8s;
        }
        .blob--3 {
            width: 350px;
            height: 350px;
            top: 50%;
            left: 35%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.08), transparent 70%);
            animation-duration: 22s;
            animation-delay: -14s;
            opacity: 0.15;
        }
        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(60px, -70px) scale(1.08) rotate(4deg);
            }
            66% {
                transform: translate(-50px, 60px) scale(0.92) rotate(-3deg);
            }
            100% {
                transform: translate(40px, -40px) scale(1.03) rotate(2deg);
            }
        }

        /* ---------- Particle Canvas ---------- */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ============================================================
           MAIN CARD
           ============================================================ */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ---------- Back Button ---------- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all var(--transition-smooth);
            margin-bottom: 18px;
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            border: 1px solid transparent;
        }
        .back-link:hover {
            color: var(--text-primary);
            border-color: var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            transform: translateX(-3px);
        }
        .back-link i {
            font-size: 0.9rem;
        }

        /* ---------- Glass Card ---------- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 36px 40px;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-card);
            padding: 1px;
            background: conic-gradient(from 0deg at 50% 50%, transparent, var(--color-emerald-glow), transparent 35%, var(--color-cyan-glow), transparent 70%, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
        }
        .glass-card:hover::before {
            opacity: 0.5;
        }

        /* ---------- Card Header ---------- */
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .card-header .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--color-emerald-dim);
            border: 1px solid rgba(0, 230, 118, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
            color: var(--color-emerald);
            transition: all var(--transition-smooth);
        }
        .card-header .icon-wrap i {
            filter: drop-shadow(0 0 20px rgba(0, 230, 118, 0.08));
        }
        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--color-emerald), var(--color-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            -webkit-text-fill-color: var(--text-muted);
        }

        /* ---------- Form ---------- */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color var(--transition-smooth);
        }
        .input-wrap .form-control {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: var(--font-family);
            font-size: 0.9rem;
            transition: all var(--transition-smooth);
            outline: none;
        }
        .input-wrap .form-control:focus {
            border-color: var(--color-emerald);
            box-shadow: 0 0 0 4px rgba(0, 230, 118, 0.04);
            background: rgba(255, 255, 255, 0.06);
        }
        .input-wrap .form-control:focus~.input-icon {
            color: var(--color-emerald);
        }
        .input-wrap .form-control::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .input-wrap .form-control.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(255, 82, 82, 0.06);
        }
        .input-wrap .form-control.error~.input-icon {
            color: var(--danger);
        }
        .input-wrap .form-control.success {
            border-color: var(--color-emerald);
            box-shadow: 0 0 0 4px rgba(0, 230, 118, 0.06);
        }
        .input-wrap .form-control.success~.input-icon {
            color: var(--color-emerald);
        }

        .input-wrap .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color var(--transition-smooth);
            border-radius: 4px;
        }
        .input-wrap .toggle-password:hover {
            color: var(--text-secondary);
        }

        .form-error {
            font-size: 0.75rem;
            color: var(--danger);
            margin-top: 4px;
            display: none;
            align-items: center;
            gap: 4px;
        }
        .form-error.visible {
            display: flex;
        }

        .password-strength {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .password-strength .strength-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            gap: 2px;
        }
        .password-strength .strength-bar .segment {
            flex: 1;
            height: 100%;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.06);
            transition: background 0.3s ease;
        }
        .password-strength .strength-bar .segment.active.weak {
            background: var(--danger);
        }
        .password-strength .strength-bar .segment.active.medium {
            background: var(--warning);
        }
        .password-strength .strength-bar .segment.active.strong {
            background: var(--color-emerald);
        }
        .password-strength .strength-text {
            min-width: 48px;
            text-align: right;
            font-weight: 500;
            font-size: 0.7rem;
        }

        /* ---------- Submit Button ---------- */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-smooth);
            background: linear-gradient(135deg, var(--color-emerald), var(--color-cyan));
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 230, 118, 0.15);
        }
        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-submit.loading .spinner {
            display: block;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }
        .btn-submit.loading .btn-icon {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Divider ---------- */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0 8px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }
        .divider span {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ---------- Footer Info ---------- */
        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .footer-info .user-email {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .footer-info .user-email i {
            margin-right: 4px;
            color: var(--color-emerald);
            opacity: 0.5;
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: rgba(16, 16, 16, 0.94);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            color: #fff;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast-icon {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            margin-top: 1px;
        }
        .toast--success .toast-icon {
            background: var(--color-emerald-dim);
            color: var(--color-emerald);
        }
        .toast--error .toast-icon {
            background: rgba(255, 82, 82, 0.15);
            color: var(--danger);
        }
        .toast--info .toast-icon {
            background: var(--color-cyan-dim);
            color: var(--color-cyan);
        }
        .toast--warning .toast-icon {
            background: rgba(255, 171, 64, 0.15);
            color: var(--warning);
        }
        .toast-body {
            flex: 1;
        }
        .toast-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .toast-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .toast-close {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color var(--transition-smooth);
            border-radius: 6px;
            margin-top: -2px;
        }
        .toast-close:hover {
            color: #fff;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 40px;
            }
            .glass-card {
                padding: 24px 20px;
                border-radius: var(--radius-sm);
            }
            .card-header .icon-wrap {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
            .card-header h1 {
                font-size: 1.3rem;
            }
            .input-wrap .form-control {
                padding: 10px 14px 10px 40px;
                font-size: 0.85rem;
            }
            .input-wrap .input-icon {
                left: 12px;
                font-size: 0.8rem;
            }
            .btn-submit {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
            .toast-container {
                bottom: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
            }
            .toast {
                padding: 14px 16px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .glass-card {
                padding: 18px 14px;
            }
            .card-header h1 {
                font-size: 1.1rem;
            }
            .card-header p {
                font-size: 0.75rem;
            }
            .form-group label {
                font-size: 0.75rem;
            }
            .input-wrap .form-control {
                padding: 8px 12px 8px 36px;
                font-size: 0.8rem;
            }
            .input-wrap .input-icon {
                left: 10px;
                font-size: 0.75rem;
            }
        }

        /* ---------- Reduced Motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .blob {
                animation: none !important;
            }
            .btn-submit .spinner {
                animation: none !important;
            }
        }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.10);
        }
    </style>
</head>

<body>

    <!-- ============================================================
    BACKGROUND
    ============================================================ -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="blob blob--1"></div>
        <div class="blob blob--2"></div>
        <div class="blob blob--3"></div>
    </div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="main-content">

        <!-- Back Link -->
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <!-- Password Change Card -->
        <div class="glass-card">
            <div class="card-header">
                <div class="icon-wrap"><i class="fas fa-key"></i></div>
                <h1>Change Password</h1>
                <p>Update your account password securely</p>
            </div>

            <form id="changePasswordForm" novalidate>
                <!-- Current Password -->
                <div class="form-group">
                    <label for="currentPassword">Current Password <span class="required">*</span></label>
                    <div class="input-wrap">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-control" id="currentPassword" placeholder="Enter your current password" required autocomplete="current-password" />
                        <button type="button" class="toggle-password" data-target="currentPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="currentError"><i class="fas fa-exclamation-circle"></i> <span>Please enter your current password</span></div>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <label for="newPassword">New Password <span class="required">*</span></label>
                    <div class="input-wrap">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password (min 8 chars)" required autocomplete="new-password" minlength="8" />
                        <button type="button" class="toggle-password" data-target="newPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <span>Strength:</span>
                        <div class="strength-bar">
                            <div class="segment" id="seg1"></div>
                            <div class="segment" id="seg2"></div>
                            <div class="segment" id="seg3"></div>
                            <div class="segment" id="seg4"></div>
                        </div>
                        <span class="strength-text" id="strengthText">—</span>
                    </div>
                    <div class="form-error" id="newError"><i class="fas fa-exclamation-circle"></i> <span>Password must be at least 8 characters</span></div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password <span class="required">*</span></label>
                    <div class="input-wrap">
                        <i class="fas fa-check-circle input-icon"></i>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password" />
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="confirmError"><i class="fas fa-exclamation-circle"></i> <span>Passwords do not match</span></div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-icon"><i class="fas fa-save"></i></span>
                    <span class="btn-text">Update Password</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="divider"><span>Account Security</span></div>

            <div class="footer-info">
                <span class="user-email"><i class="fas fa-envelope"></i> <span id="userEmailDisplay">—</span></span>
                <br />
                <span style="color:var(--text-muted);font-size:0.7rem;">Only authenticated users can change their password</span>
            </div>
        </div>

    </main>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- ============================================================
    FIREBASE SDK
    ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <script>
        // ================================================================
        //  1.  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB3GIu78tATEum3SUUwShhuYGr-IcJF3Eo",
            authDomain: "firstproject-44.firebaseapp.com",
            projectId: "firstproject-44",
            storageBucket: "firstproject-44.firebasestorage.app",
            messagingSenderId: "324220801352",
            appId: "1:324220801352:web:8d9ffb5dcbf119cccf637d",
            measurementId: "G-9Q8G67HLNW"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ================================================================
        //  2.  AUTH CHECK — Redirect to login if not authenticated
        // ================================================================
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            // Show user email
            const email = user.email || 'No email';
            document.getElementById('userEmailDisplay').textContent = email;
        });

        // ================================================================
        //  3.  DOM REFS
        // ================================================================
        const form = document.getElementById('changePasswordForm');
        const currentPassword = document.getElementById('currentPassword');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const currentError = document.getElementById('currentError');
        const newError = document.getElementById('newError');
        const confirmError = document.getElementById('confirmError');
        const toastContainer = document.getElementById('toastContainer');

        // Strength indicators
        const seg1 = document.getElementById('seg1');
        const seg2 = document.getElementById('seg2');
        const seg3 = document.getElementById('seg3');
        const seg4 = document.getElementById('seg4');
        const strengthText = document.getElementById('strengthText');

        // ================================================================
        //  4.  TOAST SYSTEM
        // ================================================================
        function showToast(message, type = 'info', title = '') {
            const iconMap = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle' };
            const titleMap = { success: 'Success', error: 'Error', info: 'Notice', warning: 'Warning' };
            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="toast-icon" aria-hidden="true"><i class="fas ${iconMap[type] || iconMap.info}"></i></div>
                <div class="toast-body">
                    <div class="toast-title">${title || titleMap[type] || 'Info'}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" aria-label="Dismiss"><i class="fas fa-times"></i></button>
            `;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));

            let timeout = setTimeout(() => dismissToast(toast), 5000);
            toast.querySelector('.toast-close').addEventListener('click', () => { clearTimeout(timeout);
                dismissToast(toast); });
            toast.addEventListener('mouseenter', () => clearTimeout(timeout));
            toast.addEventListener('mouseleave', () => { timeout = setTimeout(() => dismissToast(toast), 3500); });
            return toast;
        }

        function dismissToast(toast) {
            toast.classList.remove('show');
            toast.addEventListener('transitionend', () => { if (toast.parentNode) toast.remove(); }, { once: true });
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 500);
        }

        // ================================================================
        //  5.  TOGGLE PASSWORD VISIBILITY
        // ================================================================
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                if (!input) return;
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });

        // ================================================================
        //  6.  PASSWORD STRENGTH METER
        // ================================================================
        function checkPasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password) && /[^a-zA-Z0-9]/.test(password)) score++;
            return Math.min(score, 4);
        }

        function updateStrengthMeter(password) {
            const score = checkPasswordStrength(password);
            const segments = [seg1, seg2, seg3, seg4];
            const levels = ['', 'weak', 'medium', 'strong', 'strong'];
            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
            const colors = ['', 'weak', 'medium', 'strong', 'strong'];

            segments.forEach((seg, i) => {
                seg.className = 'segment';
                if (i < score) {
                    seg.classList.add('active', colors[score]);
                }
            });

            if (password.length === 0) {
                strengthText.textContent = '—';
            } else {
                strengthText.textContent = labels[score] || '—';
            }
        }

        newPassword.addEventListener('input', function() {
            updateStrengthMeter(this.value);
            // Clear error on input
            this.classList.remove('error', 'success');
            newError.classList.remove('visible');
        });

        // ================================================================
        //  7.  REAL-TIME VALIDATION
        // ================================================================
        function validateCurrentPassword() {
            const val = currentPassword.value.trim();
            if (!val) {
                currentPassword.classList.add('error');
                currentPassword.classList.remove('success');
                currentError.querySelector('span').textContent = 'Please enter your current password';
                currentError.classList.add('visible');
                return false;
            }
            currentPassword.classList.remove('error');
            currentPassword.classList.add('success');
            currentError.classList.remove('visible');
            return true;
        }

        function validateNewPassword() {
            const val = newPassword.value.trim();
            if (val.length < 8) {
                newPassword.classList.add('error');
                newPassword.classList.remove('success');
                newError.querySelector('span').textContent = 'Password must be at least 8 characters';
                newError.classList.add('visible');
                return false;
            }
            newPassword.classList.remove('error');
            newPassword.classList.add('success');
            newError.classList.remove('visible');
            return true;
        }

        function validateConfirmPassword() {
            const newVal = newPassword.value.trim();
            const confirmVal = confirmPassword.value.trim();
            if (confirmVal !== newVal || !confirmVal) {
                confirmPassword.classList.add('error');
                confirmPassword.classList.remove('success');
                confirmError.querySelector('span').textContent = 'Passwords do not match';
                confirmError.classList.add('visible');
                return false;
            }
            confirmPassword.classList.remove('error');
            confirmPassword.classList.add('success');
            confirmError.classList.remove('visible');
            return true;
        }

        currentPassword.addEventListener('blur', validateCurrentPassword);
        currentPassword.addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('error');
                this.classList.add('success');
                currentError.classList.remove('visible');
            }
        });

        confirmPassword.addEventListener('input', function() {
            const newVal = newPassword.value.trim();
            const confirmVal = this.value.trim();
            if (confirmVal === newVal && confirmVal.length >= 8) {
                this.classList.remove('error');
                this.classList.add('success');
                confirmError.classList.remove('visible');
            } else if (confirmVal.length > 0) {
                this.classList.add('error');
                this.classList.remove('success');
                confirmError.querySelector('span').textContent = 'Passwords do not match';
                confirmError.classList.add('visible');
            } else {
                this.classList.remove('error', 'success');
                confirmError.classList.remove('visible');
            }
        });

        confirmPassword.addEventListener('blur', validateConfirmPassword);

        // ================================================================
        //  8.  FORM SUBMISSION — VERIFY OLD PASSWORD + CHANGE
        // ================================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate all fields
            const isCurrentValid = validateCurrentPassword();
            const isNewValid = validateNewPassword();
            const isConfirmValid = validateConfirmPassword();

            if (!isCurrentValid || !isNewValid || !isConfirmValid) {
                showToast('Please fix all errors before continuing.', 'error', 'Validation Error');
                return;
            }

            const currentPass = currentPassword.value.trim();
            const newPass = newPassword.value.trim();

            // Check if new password is same as old
            if (currentPass === newPass) {
                showToast('New password must be different from the current password.', 'warning', 'Same Password');
                newPassword.classList.add('error');
                newError.querySelector('span').textContent = 'Must be different from current password';
                newError.classList.add('visible');
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showToast('You must be logged in to change your password.', 'error', 'Not Logged In');
                window.location.href = 'login.html';
                return;
            }

            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                // STEP 1: Re-authenticate the user with their current password
                const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
                await user.reauthenticateWithCredential(credential);

                // STEP 2: If re-auth succeeds, update the password
                await user.updatePassword(newPass);

                // Success!
                showToast('Your password has been updated successfully.', 'success', 'Password Changed');

                // Reset form
                form.reset();
                currentPassword.classList.remove('error', 'success');
                newPassword.classList.remove('error', 'success');
                confirmPassword.classList.remove('error', 'success');
                currentError.classList.remove('visible');
                newError.classList.remove('visible');
                confirmError.classList.remove('visible');
                updateStrengthMeter('');

                // Optionally sign out and redirect to login (or stay)
                // You can uncomment this if you want to force re-login
                // await auth.signOut();
                // window.location.href = 'login.html';

            } catch (error) {
                // Handle specific Firebase errors
                let message = 'An error occurred. Please try again.';
                let title = 'Error';

                switch (error.code) {
                    case 'auth/wrong-password':
                        message = 'The current password you entered is incorrect. Please try again.';
                        title = 'Wrong Password';
                        currentPassword.classList.add('error');
                        currentError.querySelector('span').textContent = 'Incorrect password';
                        currentError.classList.add('visible');
                        break;
                    case 'auth/too-many-requests':
                        message = 'Too many failed attempts. Please wait a moment and try again.';
                        title = 'Too Many Requests';
                        break;
                    case 'auth/user-not-found':
                    case 'auth/user-disabled':
                        message = 'Your account is no longer active. Please contact support.';
                        title = 'Account Issue';
                        break;
                    case 'auth/requires-recent-login':
                        message = 'For security, please sign out and sign back in before changing your password.';
                        title = 'Recent Login Required';
                        break;
                    default:
                        message = error.message || 'An unexpected error occurred. Please try again.';
                        title = 'Error';
                        console.error('Password change error:', error);
                }

                showToast(message, 'error', title);

                // If it was a wrong password, focus on current password field
                if (error.code === 'auth/wrong-password') {
                    currentPassword.focus();
                }

            } finally {
                // Remove loading state
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // ================================================================
        //  9.  PARTICLE SYSTEM
        // ================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleCount = 40;
        let animFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { resizeCanvas();
            initParticles(); });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.3 + 0.06;
                const hue = Math.random() > 0.5 ? 145 : 190;
                this.color = `hsla(${hue}, 80%, 60%, ${this.opacity})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const area = canvas.width * canvas.height;
            const target = Math.min(60, Math.max(20, Math.floor(area / 22000)));
            particleCount = target;
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update();
                p.draw(); });
            animFrameId = requestAnimationFrame(animateParticles);
        }

        resizeCanvas();
        initParticles();
        animateParticles();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { if (animFrameId) cancelAnimationFrame(animFrameId); } else { animateParticles(); }
        });

        // ================================================================
        //  10. KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            // Escape to clear focus
            if (e.key === 'Escape') {
                document.activeElement?.blur();
            }
        });

        // ================================================================
        //  11. INIT
        // ================================================================
        console.log('🔐 Change Password · Firebase Auth');
        console.log('📌 Flow: Verify old password → Update password');
        console.log('✅ Only authenticated users can change their password');
    </script>

</body>
