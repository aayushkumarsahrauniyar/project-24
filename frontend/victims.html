<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humble DZ · Victims</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --color-emerald: #00E676;
            --color-cyan: #00D9FF;
            --color-emerald-dim: rgba(0, 230, 118, 0.12);
            --color-cyan-dim: rgba(0, 217, 255, 0.10);
            --color-emerald-glow: rgba(0, 230, 118, 0.20);
            --color-cyan-glow: rgba(0, 217, 255, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --text-muted: rgba(255, 255, 255, 0.38);
            --radius-card: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Inter', 'Poppins', sans-serif;
            --header-height: 68px;
            --bottom-nav-height: 64px;
            --primary: #00E676;
            --primary-dark: #00c853;
            --danger: #ff5252;
            --danger-dark: #d32f2f;
            --warning: #ffab40;
            --info: #40c4ff;
        }

        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background: #080808;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0, 230, 118, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 217, 255, 0.02) 0%, transparent 50%);
        }

        /* ---------- Animated Background ---------- */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #080808;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            will-change: transform, opacity;
            animation: blobFloat 24s ease-in-out infinite alternate;
        }
        .blob--1 {
            width: 700px;
            height: 700px;
            top: -20%;
            left: -15%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.25), transparent 70%);
            animation-duration: 28s;
        }
        .blob--2 {
            width: 550px;
            height: 550px;
            bottom: -15%;
            right: -10%;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.20), transparent 70%);
            animation-duration: 30s;
            animation-delay: -8s;
        }
        .blob--3 {
            width: 400px;
            height: 400px;
            top: 45%;
            left: 35%;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.08), transparent 70%);
            animation-duration: 22s;
            animation-delay: -14s;
            opacity: 0.15;
        }
        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(60px, -70px) scale(1.08) rotate(4deg);
            }
            66% {
                transform: translate(-50px, 60px) scale(0.92) rotate(-3deg);
            }
            100% {
                transform: translate(40px, -40px) scale(1.03) rotate(2deg);
            }
        }

        /* ---------- Particle Canvas ---------- */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            margin: 0 auto;
            max-width: 1440px;
            padding: 20px 32px 32px 32px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding-bottom: calc(32px + var(--bottom-nav-height));
            width: 100%;
        }

        /* ---------- Top Bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0 18px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-left .back-btn {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all var(--transition-smooth);
            font-family: var(--font-family);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .topbar-left .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transform: translateX(-2px);
        }
        .topbar-left .page-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--color-emerald), var(--color-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .topbar-left .page-title i {
            -webkit-text-fill-color: var(--color-emerald);
            margin-right: 6px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .topbar-right .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .topbar-right .user-info .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-emerald-dim), var(--color-cyan-dim));
            border: 1px solid rgba(0, 230, 118, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--color-emerald);
            transition: all var(--transition-smooth);
        }
        .topbar-right .user-info .user-name {
            font-weight: 600;
        }
        .topbar-right .sign-out-btn {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all var(--transition-smooth);
            font-family: var(--font-family);
            font-size: 0.8rem;
        }
        .topbar-right .sign-out-btn:hover {
            background: rgba(255, 82, 82, 0.08);
            color: #ff5252;
            border-color: rgba(255, 82, 82, 0.15);
        }

        /* ---------- Action Buttons ---------- */
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-xs);
            font-family: var(--font-family);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        .btn-action:active {
            transform: translateY(0);
        }
        .btn-action.danger {
            background: rgba(255, 82, 82, 0.08);
            color: #ff5252;
            border-color: rgba(255, 82, 82, 0.12);
        }
        .btn-action.danger:hover {
            background: rgba(255, 82, 82, 0.18);
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.15);
            border-color: rgba(255, 82, 82, 0.25);
        }
        .btn-action.primary {
            background: var(--color-emerald-dim);
            color: var(--color-emerald);
            border-color: rgba(0, 230, 118, 0.15);
        }
        .btn-action.primary:hover {
            background: rgba(0, 230, 118, 0.18);
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.08);
            border-color: rgba(0, 230, 118, 0.25);
        }
        .btn-action.info {
            background: rgba(64, 196, 255, 0.08);
            color: var(--info);
            border-color: rgba(64, 196, 255, 0.12);
        }
        .btn-action.info:hover {
            background: rgba(64, 196, 255, 0.16);
            box-shadow: 0 8px 25px rgba(64, 196, 255, 0.08);
        }
        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-action-sm {
            padding: 5px 12px;
            font-size: 0.7rem;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        /* ---------- Glass Card ---------- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            box-shadow: var(--glass-shadow);
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-card);
            padding: 1px;
            background: conic-gradient(from 0deg at 50% 50%, transparent, var(--color-emerald-glow), transparent 35%, var(--color-cyan-glow), transparent 70%, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
        }
        .glass-card:hover::before {
            opacity: 0.5;
        }

        /* ---------- Table Controls ---------- */
        .table-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--glass-border);
        }
        .table-controls-left {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .table-controls-right {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .control-select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xs);
            padding: 7px 12px;
            color: #fff;
            font-family: var(--font-family);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            transition: border-color var(--transition-smooth);
            min-width: 60px;
        }
        .control-select:focus {
            border-color: var(--color-emerald);
        }
        .control-select option {
            background: #1a1a1a;
            color: #fff;
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrap i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
            pointer-events: none;
        }
        .search-wrap input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xs);
            padding: 8px 14px 8px 36px;
            color: #fff;
            font-family: var(--font-family);
            font-size: 0.8rem;
            outline: none;
            width: 220px;
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
        }
        .search-wrap input:focus {
            border-color: var(--color-emerald);
            box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.04);
        }
        .search-wrap input::placeholder {
            color: var(--text-muted);
        }

        .records-counter {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .records-counter strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .selected-counter {
            font-size: 0.75rem;
            color: var(--color-emerald);
            background: var(--color-emerald-dim);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 230, 118, 0.08);
            white-space: nowrap;
            display: none;
        }
        .selected-counter.visible {
            display: inline-block;
        }

        /* ---------- Table ---------- */
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            -webkit-overflow-scrolling: touch;
        }
        .table-responsive table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 800px;
        }
        .table-responsive thead {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
        }
        .table-responsive th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: color var(--transition-smooth);
            position: relative;
            white-space: nowrap;
        }
        .table-responsive th:hover {
            color: var(--text-primary);
        }
        .table-responsive th .sort-icon {
            margin-left: 4px;
            font-size: 0.6rem;
            opacity: 0.3;
            transition: opacity var(--transition-smooth);
        }
        .table-responsive th:hover .sort-icon {
            opacity: 0.8;
        }
        .table-responsive th .sort-icon.active {
            opacity: 1;
            color: var(--color-emerald);
        }
        .table-responsive th .checkbox-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .table-responsive td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            vertical-align: middle;
            transition: background var(--transition-smooth);
        }
        .table-responsive tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .table-responsive tr.selected td {
            background: rgba(0, 230, 118, 0.04);
        }
        .table-responsive tr:last-child td {
            border-bottom: none;
        }

        /* Checkbox styling */
        .checkbox-custom {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--glass-border);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all var(--transition-smooth);
            flex-shrink: 0;
        }
        .checkbox-custom:checked {
            background: var(--color-emerald);
            border-color: var(--color-emerald);
        }
        .checkbox-custom:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 11px;
            font-weight: 700;
        }
        .checkbox-custom:hover {
            border-color: var(--color-emerald);
        }
        .checkbox-custom:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Status badge */
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .status-badge.active {
            background: rgba(0, 230, 118, 0.12);
            color: var(--color-emerald);
            border: 1px solid rgba(0, 230, 118, 0.08);
        }
        .status-badge.pending {
            background: rgba(255, 171, 64, 0.12);
            color: var(--warning);
            border: 1px solid rgba(255, 171, 64, 0.08);
        }
        .status-badge.blocked {
            background: rgba(255, 82, 82, 0.12);
            color: var(--danger);
            border: 1px solid rgba(255, 82, 82, 0.08);
        }
        .status-badge.unknown {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }

        /* IP masked */
        .ip-masked {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Country badge */
        .country-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            background: var(--color-cyan-dim);
            color: var(--color-cyan);
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid rgba(0, 217, 255, 0.05);
        }

        /* Action buttons in table */
        .row-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .row-actions .btn-action {
            padding: 4px 10px;
            font-size: 0.7rem;
            min-width: 32px;
            justify-content: center;
        }
        .row-actions .btn-action.view-btn {
            color: var(--info);
            border-color: rgba(64, 196, 255, 0.10);
            background: rgba(64, 196, 255, 0.04);
        }
        .row-actions .btn-action.view-btn:hover {
            background: rgba(64, 196, 255, 0.12);
            border-color: rgba(64, 196, 255, 0.20);
        }
        .row-actions .btn-action.edit-btn {
            color: var(--warning);
            border-color: rgba(255, 171, 64, 0.10);
            background: rgba(255, 171, 64, 0.04);
        }
        .row-actions .btn-action.edit-btn:hover {
            background: rgba(255, 171, 64, 0.12);
            border-color: rgba(255, 171, 64, 0.20);
        }
        .row-actions .btn-action.delete-btn {
            color: var(--danger);
            border-color: rgba(255, 82, 82, 0.10);
            background: rgba(255, 82, 82, 0.04);
        }
        .row-actions .btn-action.delete-btn:hover {
            background: rgba(255, 82, 82, 0.12);
            border-color: rgba(255, 82, 82, 0.20);
        }

        /* ---------- Pagination ---------- */
        .pagination-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            margin-top: 16px;
            gap: 12px;
        }
        .pagination-info {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .pagination-info strong {
            color: var(--text-primary);
            font-weight: 600;
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .pagination-controls button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all var(--transition-smooth);
            min-width: 36px;
            text-align: center;
        }
        .pagination-controls button:hover:not(:disabled):not(.active) {
            background: rgba(255, 255, 255, 0.06);
        }
        .pagination-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .pagination-controls button.active {
            background: var(--color-emerald-dim);
            color: var(--color-emerald);
            border-color: rgba(0, 230, 118, 0.15);
        }
        .pagination-controls .page-btn {
            min-width: 36px;
            text-align: center;
        }

        /* ---------- Skeleton ---------- */
        .skeleton {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            animation: pulse 1.6s ease-in-out infinite;
            height: 16px;
        }
        .skeleton-sm {
            height: 12px;
        }
        .skeleton-circle {
            border-radius: 50%;
            width: 32px;
            height: 32px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ---------- Empty State ---------- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.15;
        }
        .empty-state h3 {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
        .empty-state p {
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: rgba(16, 16, 16, 0.94);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            color: #fff;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast-icon {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .toast--success .toast-icon {
            background: var(--color-emerald-dim);

        }
        .toast--error .toast-icon {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }
        .toast--info .toast-icon {
            background: var(--color-cyan-dim);
            color: var(--color-cyan);
        }
        .toast--warning .toast-icon {
            background: rgba(255, 171, 64, 0.15);
            color: var(--warning);
        }
        .toast-body {
            flex: 1;

        .toast-title {
            font-size: 0.85rem;

            margin-bottom: 2px;

        .toast-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .toast-close {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color var(--transition-smooth);
            border-radius: 6px;
            margin-top: -2px;
        }
        .toast-close:hover {
            color: #fff;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: rgba(16, 16, 16, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            padding: 32px 36px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .modal-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 16px;
        }
        .modal-icon.danger {
            background: rgba(255, 82, 82, 0.12);

        }
        .modal-icon.warning {
            background: rgba(255, 171, 64, 0.12);
            color: var(--warning);
        }
        .modal-icon.info {
            background: var(--color-cyan-dim);
            color: var(--color-cyan);
        }
        .modal h2 {
            text-align: center;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .modal p {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal .modal-actions .btn-action {
            min-width: 100px;
            justify-content: center;
        }
        #modalJsonBtn {
            display: none;
        }

        /* ============================================================
           RESPONSIVE — Same table view on all devices
           ============================================================ */
        @media (max-width: 1024px) {
            .main-content {
                padding: 16px 20px 28px 20px;
            }

                min-width: 800px;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 12px 14px 20px 14px;
                padding-bottom: calc(20px + var(--bottom-nav-height) + 8px);
            }

            .topbar {

            }
            .topbar-left .page-title {

            /* Table with horizontal scroll on mobile — same as desktop */
            .table-responsive {

            .table-responsive table {

            .modal {

        @media (max-width: 480px) {

            }
            .row-actions .btn-action {
                padding: 3px 8px;
                font-size: 0.6rem;
                min-width: 26px;
            }
        }

        /* ---------- Reduced Motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar {

            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);

<body>

    <!-- ============================================================
    BACKGROUND
    ============================================================ -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="blob blob--1"></div>
        <div class="blob blob--2"></div>
        <div class="blob blob--3"></div>
    </div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="main-content" id="mainContent">

        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
                <h1 class="page-title"><i class="fas fa-folder-open"></i> VICTIMS</h1>

            <div class="topbar-right">
                <div class="action-buttons">
                    <button class="btn-action danger" id="removeAllBtn"><i class="fas fa-trash-alt"></i> <span>Remove All</span></button>
                    <button class="btn-action primary" id="downloadAllBtn"><i class="fas fa-download"></i> <span>Download All</span></button>
                    <button class="btn-action info" id="exportSelectedBtn" disabled><i class="fas fa-check-double"></i> <span>Export Selected</span></button>

            </div>
        </header>

        <!-- Table Card -->
        <div class="glass-card">

            <!-- Table Controls -->
            <div class="table-controls">
                <div class="table-controls-left">
                    <div class="control-group">
                        <label for="entriesSelect">Show</label>
                        <select class="control-select" id="entriesSelect">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search victims..." />
                    </div>
                    <span class="selected-counter" id="selectedCounter"><i class="fas fa-check-circle"></i> <span id="selectedCount">0</span> selected</span>
                </div>
                <div class="table-controls-right">
                    <span class="records-counter" id="recordsCounter">Total: <strong id="totalRecords">0</strong></span>
                </div>
            </div>

            <!-- Table — Same view on all devices, horizontal scroll on mobile -->
            <div class="table-responsive" id="tableWrapper">
                <table id="victimsTable">
                    <thead id="tableHead">
                        <tr>
                            <th style="width:40px;text-align:center;">
                                <input type="checkbox" class="checkbox-custom" id="selectAll" />
                            </th>
                            <th data-sort="id">ID <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                            <th data-sort="scama">Temp Disc <span class="sort-icon"><i class="fas fa-sort"></i></span></th>

                            <th data-sort="status">Status <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                            <th data-sort="victimeDate">Submission Date <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                            <th data-sort="victimeIp">IP Address <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                            <th data-sort="country">Country <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                            <th style="width:140px;text-align:center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination-wrap">
                <div class="pagination-info" id="paginationInfo">Showing <strong>0</strong> to <strong>0</strong> of <strong>0</strong> entries</div>
                <div class="pagination-controls" id="paginationControls">
                    <button id="prevPage" disabled><i class="fas fa-chevron-left"></i></button>
                    <span id="pageNumbers"></span>

    </main>

    <!-- ============================================================
    MODAL
    ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <div class="modal-icon" id="modalIcon"><i class="fas fa-exclamation-triangle"></i></div>
            <h2 id="modalTitle">Confirm Action</h2>
            <p id="modalMessage">Are you sure you want to perform this action?</p>
            <div class="modal-actions">
                <button class="btn-action" id="modalCancelBtn">Cancel</button>
                <button class="btn-action danger" id="modalConfirmBtn">Confirm</button>
                <button class="btn-action info" id="modalJsonBtn" style="display:none;">JSON</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- ============================================================
    FIREBASE SDK
    ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <script>
        // ================================================================
        //  1.  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB3GIu78tATEum3SUUwShhuYGr-IcJF3Eo",
            authDomain: "firstproject-44.firebaseapp.com",
            projectId: "firstproject-44",
            storageBucket: "firstproject-44.firebasestorage.app",
            messagingSenderId: "324220801352",
            appId: "1:324220801352:web:8d9ffb5dcbf119cccf637d",
            measurementId: "G-9Q8G67HLNW"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        // ================================================================
        //  2.  AUTH CHECK
        // ================================================================
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            const name = user.displayName || user.email?.split('@')[0] || 'Admin';
            document.getElementById('userNameDisplay').textContent = name;
            loadVictims();
        });

        // ================================================================
        //  3.  DOM REFS
        // ================================================================
        const tableBody = document.getElementById('tableBody');
        const totalRecords = document.getElementById('totalRecords');
        const paginationInfo = document.getElementById('paginationInfo');
        const pageNumbers = document.getElementById('pageNumbers');
        const prevPageBtn = document.getElementById('prevPage');
        const nextPageBtn = document.getElementById('nextPage');
        const entriesSelect = document.getElementById('entriesSelect');
        const searchInput = document.getElementById('searchInput');
        const selectAll = document.getElementById('selectAll');
        const selectedCounter = document.getElementById('selectedCounter');
        const selectedCount = document.getElementById('selectedCount');
        const exportSelectedBtn = document.getElementById('exportSelectedBtn');
        const removeAllBtn = document.getElementById('removeAllBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const toastContainer = document.getElementById('toastContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalJsonBtn = document.getElementById('modalJsonBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalIcon = document.getElementById('modalIcon');

        // ================================================================
        //  4.  STATE
        // ================================================================
        let allVictims = [];
        let filteredVictims = [];
        let currentPage = 1;
        let pageSize = 25;
        let sortField = 'createdAt';
        let sortDirection = 'desc';
        let selectedIds = new Set();
        let unsubscribe = null;
        let modalResolve = null;
        let modalFormat = null;

        // ================================================================
        //  5.  TOAST SYSTEM
        // ================================================================
        function showToast(message, type = 'info', title = '') {
            const iconMap = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle' };
            const titleMap = { success: 'Success', error: 'Error', info: 'Notice', warning: 'Warning' };
            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="toast-icon" aria-hidden="true"><i class="fas ${iconMap[type] || iconMap.info}"></i></div>
                <div class="toast-body">
                    <div class="toast-title">${title || titleMap[type] || 'Info'}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" aria-label="Dismiss"><i class="fas fa-times"></i></button>
            `;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));

            let timeout = setTimeout(() => dismissToast(toast), 4500);
            toast.querySelector('.toast-close').addEventListener('click', () => { clearTimeout(timeout);
                dismissToast(toast); });
            toast.addEventListener('mouseenter', () => clearTimeout(timeout));
            toast.addEventListener('mouseleave', () => { timeout = setTimeout(() => dismissToast(toast), 3500); });
            return toast;
        }

        function dismissToast(toast) {
            toast.classList.remove('show');
            toast.addEventListener('transitionend', () => { if (toast.parentNode) toast.remove(); }, { once: true });
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 500);
        }

        // ================================================================
        //  6.  MODAL SYSTEM
        // ================================================================
        function showModal(title, message, type = 'danger', confirmText = 'Confirm', showJson = false) {
            return new Promise((resolve) => {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalIcon.className = `modal-icon ${type}`;
                const iconMap = { danger: 'fa-exclamation-triangle', warning: 'fa-exclamation-circle',
                    info: 'fa-info-circle' };
                modalIcon.innerHTML = `<i class="fas ${iconMap[type] || iconMap.danger}"></i>`;
                modalConfirmBtn.textContent = confirmText;
                modalConfirmBtn.className = `btn-action ${type}`;
                modalJsonBtn.style.display = showJson ? 'inline-flex' : 'none';
                modalOverlay.classList.add('active');
                modalResolve = resolve;
                modalFormat = null;
            });
        }

        function closeModal(result, format = null) {
            modalOverlay.classList.remove('active');
            if (modalResolve) {
                modalResolve(result, format);
                modalResolve = null;
            }
        }

        modalCancelBtn.addEventListener('click', () => closeModal(false));
        modalConfirmBtn.addEventListener('click', () => closeModal(true, 'csv'));
        modalJsonBtn.addEventListener('click', () => closeModal(true, 'json'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal(false);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(false);
        });

        // ================================================================
        //  7.  SIGN OUT
        // ================================================================
        signOutBtn.addEventListener('click', async () => {
            try {
                await auth.signOut();
                showToast('Signed out successfully.', 'success', 'Goodbye');
                window.location.href = 'login.html';
            } catch (err) {
                showToast('Error signing out.', 'error');
            }
        });

        // ================================================================
        //  8.  LOAD VICTIMS
        // ================================================================
        function loadVictims() {
            if (unsubscribe) { unsubscribe();
                unsubscribe = null; }
            showSkeletons();

            unsubscribe = db.collection('victims')
                .orderBy('createdAt', 'desc')
                .onSnapshot((snapshot) => {
                    const docs = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        docs.push({
                            id: doc.id,
                            scama: data.scama || 'Untitled',
                            userName: data.userName || '—',
                            userPass: data.userPass || '—',
                            victimeDate: data.victimeDate || '—',
                            victimeIp: data.victimeIp || '—',
                            country: data.country || '—',
                            createdAt: data.createdAt || null,
                            status: data.status || 'active',
                        });
                    });
                    allVictims = docs;
                    applyFiltersAndRender();
                }, (error) => {
                    console.error('Victims error:', error);
                    showToast('Error loading victims: ' + error.message, 'error');
                    tableBody.innerHTML = `
                        <tr><td colspan="9">
                            <div class="empty-state">
                                <i class="fas fa-exclamation-triangle" style="color:#ff5252;"></i>
                                <h3>Error loading data</h3>
                                <p>${error.message}</p>
                                <button onclick="loadVictims()" style="margin-top:12px;padding:8px 20px;border-radius:8px;background:var(--color-emerald-dim);color:var(--color-emerald);border:1px solid rgba(0,230,118,0.15);cursor:pointer;font-family:var(--font-family);font-size:0.8rem;">Retry</button>
                            </div>
                        </td></tr>
                    `;
                });
        }

        // ================================================================
        //  9.  SKELETON LOADING
        // ================================================================
        function showSkeletons() {
            const skeletonRows = Array.from({ length: pageSize }, (_, i) => `
                <tr>
                    <td><div class="skeleton skeleton-circle" style="margin:0 auto;"></div></td>
                    <td><div class="skeleton" style="width:40px;"></div></td>
                    <td><div class="skeleton" style="width:100px;"></div></td>
                    <td><div class="skeleton" style="width:80px;"></div></td>
                    <td><div class="skeleton" style="width:60px;"></div></td>
                    <td><div class="skeleton" style="width:100px;"></div></td>
                    <td><div class="skeleton" style="width:90px;"></div></td>
                    <td><div class="skeleton" style="width:60px;"></div></td>
                    <td><div class="skeleton" style="width:100px;"></div></td>
                </tr>
            `).join('');
            tableBody.innerHTML = skeletonRows;
            totalRecords.textContent = '...';
            paginationInfo.innerHTML = 'Loading...';
            pageNumbers.innerHTML = '';
            prevPageBtn.disabled = true;
            nextPageBtn.disabled = true;
        }

        // ================================================================
        //  10. FILTER, SORT, PAGINATE
        // ================================================================
        function applyFiltersAndRender() {
            const query = searchInput.value.trim().toLowerCase();

            if (query) {
                filteredVictims = allVictims.filter(v =>
                    v.scama.toLowerCase().includes(query) ||
                    v.userName.toLowerCase().includes(query) ||
                    v.userPass.toLowerCase().includes(query) ||
                    v.victimeIp.toLowerCase().includes(query) ||
                    v.country.toLowerCase().includes(query) ||
                    v.id.toLowerCase().includes(query)
                );
            } else {
                filteredVictims = [...allVictims];
            }

            filteredVictims.sort((a, b) => {
                let valA = a[sortField] || '';
                let valB = b[sortField] || '';
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();
                if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            const ids = new Set(filteredVictims.map(v => v.id));
            for (const id of selectedIds) {
                if (!ids.has(id)) selectedIds.delete(id);
            }
            updateSelectedUI();

            currentPage = 1;
            renderTable();
        }

        // ================================================================
        //  11. RENDER TABLE
        // ================================================================
        function renderTable() {
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, filteredVictims.length);
            const pageData = filteredVictims.slice(start, end);

            totalRecords.textContent = filteredVictims.length;

            if (filteredVictims.length === 0) {
                tableBody.innerHTML = `
                    <tr><td colspan="9">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>No victims found</h3>
                            <p>${allVictims.length === 0 ? 'Start collecting data and it will appear here.' : 'Try adjusting your search.'}</p>
                        </div>
                    </td></tr>
                `;
            } else {
                tableBody.innerHTML = pageData.map(v => `
                    <tr class="${selectedIds.has(v.id) ? 'selected' : ''}" data-id="${v.id}">
                        <td style="text-align:center;">
                            <input type="checkbox" class="checkbox-custom row-checkbox" data-id="${v.id}" ${selectedIds.has(v.id) ? 'checked' : ''} />
                        </td>
                        <td><span style="font-family:monospace;font-size:0.7rem;color:var(--text-muted);">#${v.id.slice(0,6)}</span></td>
                        <td><strong>${escHtml(v.scama)}</strong></td>
                        <td>${escHtml(v.userName)}</td>
                        <td>${getStatusBadge(v.status)}</td>
                        <td>${escHtml(v.victimeDate)}</td>
                        <td><span class="ip-masked">${maskIP(v.victimeIp)}</span></td>
                        <td><span class="country-badge">${escHtml(v.country)}</span></td>
                        <td>
                            <div class="row-actions">
                                <button class="btn-action view-btn btn-action-sm" data-id="${v.id}" title="View"><i class="fas fa-eye"></i></button>
                                <button class="btn-action edit-btn btn-action-sm" data-id="${v.id}" title="Edit"><i class="fas fa-edit"></i></button>
                                <button class="btn-action delete-btn btn-action-sm" data-id="${v.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');

                document.querySelectorAll('.row-checkbox').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = this.dataset.id;
                        if (this.checked) {
                            selectedIds.add(id);
                        } else {
                            selectedIds.delete(id);
                        }
                        updateSelectedUI();
                        const row = document.querySelector(`tr[data-id="${id}"]`);
                        if (row) row.classList.toggle('selected', this.checked);
                    });
                });

                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const victim = allVictims.find(v => v.id === id);
                        if (victim) showToast(`Viewing: ${victim.userName}`, 'info', 'View');
                    });
                });
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const victim = allVictims.find(v => v.id === id);
                        if (victim) showToast(`Edit: ${victim.userName}`, 'warning', 'Edit Mode');
                    });
                });
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        deleteVictim(id);
                    });
                });
            }

            updatePagination(start, end);

            const visibleIds = pageData.map(v => v.id);
            const allChecked = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
            selectAll.checked = allChecked;
        }

        // ================================================================
        //  12. HELPERS
        // ================================================================
        function escHtml(str) {
            if (!str) return '—';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function maskIP(ip) {
            if (!ip || ip === '—') return '—';
            const parts = ip.split('.');
            if (parts.length === 4) {
                return `${parts[0]}.${parts[1]}.${parts[2]}.***`;
            }
            return ip.substring(0, ip.length - 4) + '****';
        }

        function getStatusBadge(status) {
            const statusMap = {
                active: '<span class="status-badge active">Active</span>',
                pending: '<span class="status-badge pending">Pending</span>',
                blocked: '<span class="status-badge blocked">Blocked</span>',
            };
            return statusMap[status] || '<span class="status-badge unknown">Unknown</span>';
        }

        function updateSelectedUI() {
            const count = selectedIds.size;
            selectedCount.textContent = count;
            selectedCounter.classList.toggle('visible', count > 0);
            exportSelectedBtn.disabled = count === 0;
        }

        // ================================================================
        //  13. PAGINATION
        // ================================================================
        function updatePagination(start, end) {
            const total = filteredVictims.length;
            const totalPages = Math.ceil(total / pageSize) || 1;

            paginationInfo.innerHTML =
                `Showing <strong>${total === 0 ? 0 : start + 1}</strong> to <strong>${end}</strong> of <strong>${total}</strong> entries`;

            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;

            let html = '';
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" data-page="1">1</button>`;
                if (startPage > 2) html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
                html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
            }
            pageNumbers.innerHTML = html;

            pageNumbers.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = parseInt(btn.dataset.page);
                    if (page !== currentPage) { currentPage = page;
                        renderTable(); }
                });
            });
        }

        // ================================================================
        //  14. SORTING
        // ================================================================
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', function() {
                const field = this.dataset.sort;
                if (sortField === field) {
                    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    sortField = field;
                    sortDirection = 'asc';
                }
                document.querySelectorAll('th[data-sort] .sort-icon').forEach(icon => {
                    icon.classList.remove('active');
                    icon.innerHTML = '<i class="fas fa-sort"></i>';
                });
                const icon = this.querySelector('.sort-icon');
                icon.classList.add('active');
                icon.innerHTML = sortDirection === 'asc' ?
                    '<i class="fas fa-sort-up"></i>' :
                    '<i class="fas fa-sort-down"></i>';
                applyFiltersAndRender();
            });
        });

        // ================================================================
        //  15. SEARCH & ENTRIES
        // ================================================================
        let searchTimeout = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFiltersAndRender, 300);
        });

        entriesSelect.addEventListener('change', () => {
            pageSize = parseInt(entriesSelect.value);
            currentPage = 1;
            renderTable();
        });

        // ================================================================
        //  16. SELECT ALL
        // ================================================================
        selectAll.addEventListener('change', function() {
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, filteredVictims.length);
            const pageData = filteredVictims.slice(start, end);
            if (this.checked) {
                pageData.forEach(v => selectedIds.add(v.id));
            } else {
                pageData.forEach(v => selectedIds.delete(v.id));
            }
            updateSelectedUI();
            renderTable();
        });

        // ================================================================
        //  17. DELETE VICTIM
        // ================================================================
        async function deleteVictim(id) {
            const confirmed = await showModal(
                'Delete Victim',
                'Are you sure you want to delete this victim record? This action cannot be undone.',
                'danger',
                'Delete'
            );
            if (!confirmed) return;

            try {
                await db.collection('victims').doc(id).delete();
                selectedIds.delete(id);
                showToast('Victim record deleted.', 'success', 'Deleted');
                updateSelectedUI();
            } catch (err) {
                showToast('Error deleting: ' + err.message, 'error');
            }
        }

        // ================================================================
        //  18. REMOVE ALL
        // ================================================================
        removeAllBtn.addEventListener('click', async () => {
            if (allVictims.length === 0) {
                showToast('No victims to remove.', 'info');
                return;
            }
            const confirmed = await showModal(
                'Remove All Victims',
                `Are you sure you want to remove all ${allVictims.length} victim records? This cannot be undone.`,
                'danger',
                'Remove All'
            );
            if (!confirmed) return;

            try {
                const batch = db.batch();
                const snap = await db.collection('victims').get();
                snap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                selectedIds.clear();
                updateSelectedUI();
                showToast(`Removed ${snap.size} records.`, 'success', 'All Removed');
            } catch (err) {
                showToast('Error removing all: ' + err.message, 'error');
            }
        });

        // ================================================================
        //  19. DOWNLOAD ALL & EXPORT SELECTED
        // ================================================================
        async function showDownloadModal(title, message) {
            return new Promise((resolve) => {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalIcon.className = 'modal-icon info';
                modalIcon.innerHTML = '<i class="fas fa-download"></i>';
                modalConfirmBtn.textContent = 'CSV';
                modalConfirmBtn.className = 'btn-action primary';
                modalJsonBtn.style.display = 'inline-flex';
                modalJsonBtn.textContent = 'JSON';
                modalJsonBtn.className = 'btn-action info';
                modalOverlay.classList.add('active');
                modalResolve = resolve;
                modalFormat = null;
            });
        }

        function closeDownloadModal(result, format) {
            modalOverlay.classList.remove('active');
            if (modalResolve) {
                modalResolve(result, format);
                modalResolve = null;
            }
        }

        // Override modal close for download
        const origClose = closeModal;
        modalCancelBtn.addEventListener('click', () => closeDownloadModal(false));
        modalConfirmBtn.addEventListener('click', () => closeDownloadModal(true, 'csv'));
        modalJsonBtn.addEventListener('click', () => closeDownloadModal(true, 'json'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeDownloadModal(false);
        });

        downloadAllBtn.addEventListener('click', async () => {
            if (allVictims.length === 0) {
                showToast('No data to download.', 'info');
                return;
            }
            const [confirmed, format] = await showDownloadModal(
                'Download All',
                `Download all ${allVictims.length} records as CSV or JSON.`
            );
            if (confirmed && format === 'csv') downloadCSV(allVictims);
            else if (confirmed && format === 'json') downloadJSON(allVictims);
        });

        exportSelectedBtn.addEventListener('click', async () => {
            const selectedData = allVictims.filter(v => selectedIds.has(v.id));
            if (selectedData.length === 0) {
                showToast('No records selected.', 'info');
                return;
            }
            const [confirmed, format] = await showDownloadModal(
                'Export Selected',
                `Export ${selectedData.length} selected records as CSV or JSON.`
            );
            if (confirmed && format === 'csv') downloadCSV(selectedData);
            else if (confirmed && format === 'json') downloadJSON(selectedData);
        });

        function downloadCSV(data) {
            if (!data || data.length === 0) return;
            const headers = ['ID', 'Template', 'Username', 'Password', 'Status', 'Date', 'IP', 'Country'];
            const rows = data.map(v => [
                v.id, v.scama, v.userName, v.userPass, v.status, v.victimeDate,
                v.victimeIp, v.country
            ]);
            const csv = [headers.join(','), ...rows.map(r => r.map(c => `"${c}"`).join(','))].join('\n');
            downloadFile(csv, `victims_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv');
            showToast(`Downloaded ${data.length} records as CSV.`, 'success', 'Downloaded');
        }

        function downloadJSON(data) {
            const json = JSON.stringify(data, null, 2);
            downloadFile(json, `victims_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
            showToast(`Downloaded ${data.length} records as JSON.`, 'success', 'Downloaded');
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ================================================================
        //  20. PARTICLE SYSTEM
        // ================================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleCount = 45;
        let animFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { resizeCanvas();
            initParticles(); });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.3 + 0.06;
                const hue = Math.random() > 0.5 ? 145 : 190;
                this.color = `hsla(${hue}, 80%, 60%, ${this.opacity})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const area = canvas.width * canvas.height;
            const target = Math.min(70, Math.max(20, Math.floor(area / 22000)));
            particleCount = target;
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update();
                p.draw(); });
            animFrameId = requestAnimationFrame(animateParticles);
        }

        resizeCanvas();
        initParticles();
        animateParticles();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { if (animFrameId) cancelAnimationFrame(animFrameId); } else { animateParticles(); }
        });

        // ================================================================
        //  21. INIT
        // ================================================================
        window.loadVictims = loadVictims;
        console.log('🚀 Victims · Premium Data Table');
        console.log('📊 Firestore: Connected to victims collection');
        console.log('🔐 Auth: Firebase Authentication active');
        console.log('📋 Features: Search, Sort, Pagination, Export, Multi-select');
        console.log('📱 Same table view on all devices with horizontal scroll on mobile');
    </script>

</body>
